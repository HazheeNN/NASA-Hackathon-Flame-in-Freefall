# Checks every pull request and every push to main. Free on GitHub Actions.
# Never calls the Claude API (no key here): the app builds and runs without one.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Data is valid (schema + cross-record rules)
        run: npm run data:validate
      - run: npm run build
      - name: DESIGN.md lints clean
        run: npx --yes @google/design.md@latest lint DESIGN.md
